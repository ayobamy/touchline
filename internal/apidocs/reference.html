<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Touchline API reference</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Scalar API Reference, pinned with Subresource Integrity (ADR 0025). -->
    <script
      src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.72.2/dist/browser/standalone.js"
      integrity="sha384-mc6GgHVwdYe1ZSU5XmJBa2pe6QzCRDSd0Pk8TqiqM7iiAOFMKtpBTOOa2RZDHkYN"
      crossorigin="anonymous"></script>
    <script>
      // No calls to third parties: no telemetry, hosted fonts, AI agent or MCP helper.
      Scalar.createApiReference('#app', {
        url: '/openapi.json',
        telemetry: false,
        withDefaultFonts: false,
        agent: { disabled: true },
        mcp: { disabled: true },
        showDeveloperTools: 'never',
      })
    </script>
  </body>
</html>
