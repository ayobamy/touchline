name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash  # explicit bash runs with -eo pipefail, so a failing pipe stage fails the step

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: false  # no third-party dependencies yet, so nothing to cache
      - name: Format, vet and test
        run: make test
      - name: Replay a full match through the stats engine
        run: go run ./cmd/simulator -seed 7 -scenario scenarios/late-press.json | go run ./cmd/stats -every 0 > /dev/null

  agents:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: agents
    env:
      TOUCHLINE_REQUIRE_INTEGRATION: "1"  # fail, not skip, if Go is missing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements-dev.txt
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod  # the integration tests start the Go server
          cache: false
      - name: Install pinned dependencies
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test with coverage
        run: coverage run -m pytest && coverage report
