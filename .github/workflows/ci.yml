name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false  # no third-party dependencies yet, so nothing to cache
      - name: Format, vet and test
        run: make test
      - name: Replay a full match through the stats engine
        run: go run ./cmd/simulator -seed 7 -scenario scenarios/late-press.json | go run ./cmd/stats -every 0 > /dev/null
